schema = 1
id = "hooks-hk"
kind = "profile"
description = "hk hooks profile (replaces default pre-commit emit)"
apply_order = 30

[[files]]
path = "hk.pkl"
render = "static"
source = "files/hk.pkl.static"
mode = "0644"

[[files]]
path = ".pre-commit-config.yaml"
render = "static"
source = "files/pre-commit-config.hk.static"
mode = "0644"
override = true
