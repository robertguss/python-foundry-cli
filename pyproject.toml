[project]
name = "python-foundry"
version = "0.1.0"
description = "AI-native hybrid foundry for modern Python projects (CLI + Core + template)"
readme = "README.md"
authors = [
    { name = "Robert Guss", email = "robertguss@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
foundry = "python_foundry.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "ty>=0.0.1a",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Golden snapshot trees are fixtures, not pytest suites.
norecursedirs = ["goldens", "*.egg", ".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg-info"]

[tool.ty.src]
exclude = ["tests/goldens/**"]
