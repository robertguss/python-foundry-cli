[project]
name = "python-foundry-template"
version = "0.1.0"
description = "Frozen public GitHub template cell (cli, empty profiles, python 3.13)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
python-foundry-template = "python_foundry_template.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "ty>=0.0.1a",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_foundry_template"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.environment]
python-version = "3.13"

# SPK-002 frozen practical defaults (PHASE-04):
# - ty Required in default verify (not demotable without DEC)
# - python-version aligned with project pin
# Residual: advanced ty rule knobs deferred; pin notes live in versions.toml
