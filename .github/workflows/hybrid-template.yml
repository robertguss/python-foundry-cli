name: hybrid-template-snapshot
on:
  push:
    paths:
      - "catalog/**"
      - "src/python_foundry/catalog/**"
      - "src/python_foundry/hybrid/**"
      - "src/python_foundry/generate/**"
      - "src/python_foundry/render/**"
      - "examples/python-foundry-template.toml"
      - "tests/goldens/hybrid-python-foundry-template/**"
      - ".github/workflows/hybrid-template.yml"
  pull_request:
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      # REQ-081 / MS-004: regenerate frozen public template cell from catalog SoT
      # and hard-fail if the tree drifts from checked-in catalog goldens.
      - name: Regenerate snapshot and fail on drift vs goldens
        run: |
          uv run python -m python_foundry.hybrid \
            --spec examples/python-foundry-template.toml \
            --golden tests/goldens/hybrid-python-foundry-template
      - name: Unit proof of drift detection
        run: uv run pytest tests/test_hybrid_snapshot.py -q
